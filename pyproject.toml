[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labsim"
version = "0.1.0"
description = "Lab Simulator - Unified Workflow MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]

[tool.pytest.ini_options]
pythonpath = ["codebase"]
testpaths = ["tests"]
